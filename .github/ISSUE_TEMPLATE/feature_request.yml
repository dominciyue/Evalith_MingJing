name: Feature request
description: Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the desired feature. Helps us evaluate the right shape.
      placeholder: "When I run Evalith in CI against a multi-turn agent, I can't ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A CLI flag, a new scorer, a config field?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or thought about.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I've checked the existing issues for duplicates.
          required: true
