- id: he-humaneval-70
  source: HumanEval
  domain: code
  input: "补全下面的 Python 函数。只输出完整的函数体(从 def 开始,可读、能跑通)。\n\n```python\ndef strange_sort_list(lst):\n    '''\n    Given list of\
    \ integers, return list in strange order.\n    Strange sorting, is when you start with the minimum value,\n    then maximum\
    \ of the remaining integers, then minimum and so on.\n\n    Examples:\n    strange_sort_list([1, 2, 3, 4]) == [1, 4, 2,\
    \ 3]\n    strange_sort_list([5, 5, 5, 5]) == [5, 5, 5, 5]\n    strange_sort_list([]) == []\n    '''```"
  expected_concepts:
  - 函数 strange_sort_list 的正确实现
  - 返回值类型正确
  - 处理 docstring 中描述的所有情形
  notes: "canonical_solution (truncated 240 chars): res, switch = [], True\n    while lst:\n        res.append(min(lst) if\
    \ switch else max(lst))\n        lst.remove(res[-1])\n        switch = not switch\n    return res"
