- id: he-humaneval-163
  source: HumanEval
  domain: code
  input: "补全下面的 Python 函数。只输出完整的函数体(从 def 开始,可读、能跑通)。\n\n```python\ndef generate_integers(a, b):\n    \"\"\"\n    Given two\
    \ positive integers a and b, return the even digits between a\n    and b, in ascending order.\n\n    For example:\n  \
    \  generate_integers(2, 8) => [2, 4, 6, 8]\n    generate_integers(8, 2) => [2, 4, 6, 8]\n    generate_integers(10, 14)\
    \ => []\n    \"\"\"```"
  expected_concepts:
  - 函数 generate_integers 的正确实现
  - 返回值类型正确
  - 处理 docstring 中描述的所有情形
  notes: "canonical_solution (truncated 240 chars): lower = max(2, min(a, b))\n    upper = min(8, max(a, b))\n\n    return\
    \ [i for i in range(lower, upper+1) if i % 2 == 0]"
