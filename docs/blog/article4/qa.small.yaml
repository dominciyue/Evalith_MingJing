- id: he-humaneval-151
  source: HumanEval
  domain: code
  input: "补全下面的 Python 函数。只输出完整的函数体(从 def 开始,可读、能跑通)。\n\n```python\ndef double_the_difference(lst):\n    '''\n    Given a\
    \ list of numbers, return the sum of squares of the numbers\n    in the list that are odd. Ignore numbers that are negative\
    \ or not integers.\n    \n    double_the_difference([1, 3, 2, 0]) == 1 + 9 + 0 + 0 = 10\n    double_the_difference([-1,\
    \ -2, 0]) == 0\n    double_the_difference([9, -2]) == 81\n    double_the_difference([0]) == 0  \n   \n    If the input\
    \ list is empty, return 0.\n    '''```"
  expected_concepts:
  - 函数 double_the_difference 的正确实现
  - 返回值类型正确
  - 处理 docstring 中描述的所有情形
  notes: 'canonical_solution (truncated 240 chars): return sum([i**2 for i in lst if i > 0 and i%2!=0 and "." not in str(i)])'
