- id: he-humaneval-163
  source: HumanEval
  domain: code
  input: "补全下面的 Python 函数。只输出完整的函数体(从 def 开始,可读、能跑通)。\n\n```python\ndef generate_integers(a, b):\n    \"\"\"\n    Given two\
    \ positive integers a and b, return the even digits between a\n    and b, in ascending order.\n\n    For example:\n  \
    \  generate_integers(2, 8) => [2, 4, 6, 8]\n    generate_integers(8, 2) => [2, 4, 6, 8]\n    generate_integers(10, 14)\
    \ => []\n    \"\"\"```"
  expected_concepts:
  - 函数 generate_integers 的正确实现
  - 返回值类型正确
  - 处理 docstring 中描述的所有情形
  notes: "canonical_solution (truncated 240 chars): lower = max(2, min(a, b))\n    upper = min(8, max(a, b))\n\n    return\
    \ [i for i in range(lower, upper+1) if i % 2 == 0]"
- id: he-humaneval-108
  source: HumanEval
  domain: code
  input: "补全下面的 Python 函数。只输出完整的函数体(从 def 开始,可读、能跑通)。\n\n```python\ndef count_nums(arr):\n    \"\"\"\n    Write a function\
    \ count_nums which takes an array of integers and returns\n    the number of elements which has a sum of digits > 0.\n\
    \    If a number is negative, then its first signed digit will be negative:\n    e.g. -123 has signed digits -1, 2, and\
    \ 3.\n    >>> count_nums([]) == 0\n    >>> count_nums([-1, 11, -11]) == 1\n    >>> count_nums([1, 1, 2]) == 3\n    \"\"\
    \"```"
  expected_concepts:
  - 函数 count_nums 的正确实现
  - 返回值类型正确
  - 处理 docstring 中描述的所有情形
  notes: "canonical_solution (truncated 240 chars): def digits_sum(n):\n        neg = 1\n        if n < 0: n, neg = -1 * n,\
    \ -1 \n        n = [int(i) for i in str(n)]\n        n[0] = n[0] * neg\n        return sum(n)\n    return len(list(filter(lambda\
    \ x: x > 0, [digits_sum(i) for i in arr])))"
- id: he-humaneval-62
  source: HumanEval
  domain: code
  input: "补全下面的 Python 函数。只输出完整的函数体(从 def 开始,可读、能跑通)。\n\n```python\ndef derivative(xs: list):\n    \"\"\" xs represent coefficients\
    \ of a polynomial.\n    xs[0] + xs[1] * x + xs[2] * x^2 + ....\n     Return derivative of this polynomial in the same\
    \ form.\n    >>> derivative([3, 1, 2, 4, 5])\n    [1, 4, 12, 20]\n    >>> derivative([1, 2, 3])\n    [2, 6]\n    \"\"\"\
    ```"
  expected_concepts:
